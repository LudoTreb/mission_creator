[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-creator"
version = "0.1.0"
description = "Générateur de structure de dossiers pour nouvelles missions graphiques"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
# Lance le script avec la commande : mission-creator
mission-creator = "mission_creator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",        # linter + formatter
    "mypy>=1.8",        # vérification de types
]

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (linter + formatter, remplace flake8 + black) ──────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

# ── Mypy (types) ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mission_creator --cov-report=term-missing"
